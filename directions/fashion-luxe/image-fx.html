<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fashion-luxe — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    background:#f7f3ee; /* --canvas */
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
  }

  /* full-bleed hero media, scaled to a representative framed crop */
  .hero__media{
    position:relative;
    width:260px;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#1a1418;
  }
  .hero__media .u-photo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:50% 28%;
    filter:grayscale(100%) contrast(1.06);
  }
  /* gradient scrim */
  .hero__media::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(13,13,15,.25) 0%,rgba(13,13,15,0) 30%,rgba(13,13,15,.55) 100%);
    pointer-events:none;
  }
  /* magenta corner tab */
  .hero__tag{
    position:absolute;
    top:0;left:0;
    z-index:3;
    background:#e0218a; /* --accent */
    color:#fff;
    font-family:'Inter', system-ui, sans-serif;
    font-size:8px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:6px 11px;
  }
  /* bottom-right caption */
  .hero__caption{
    position:absolute;
    right:11px;bottom:10px;
    z-index:3;
    color:rgba(255,255,255,.82);
    text-align:right;
    text-shadow:0 1px 8px rgba(0,0,0,.5);
    font-family:'Inter', system-ui, sans-serif;
    font-size:8px;
    font-weight:500;
    letter-spacing:.5px;
    line-height:1.4;
    margin:0;
  }
</style>
</head>
<body>
  <div class="hero__media">
    <span class="hero__tag">Poolside Mirage · Vogue Italia</span>
    <img class="u-photo" src="portrait.webp"
         alt="Sienna Marchetti styling — Poolside Mirage editorial">
    <p class="hero__caption">Cover + 14-page story<br>Photographed in Palm Springs</p>
  </div>
</body>
</html>
