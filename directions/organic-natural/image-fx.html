<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>organic-natural · photo specimen</title>
<style>
  /* direction page background = --canvas */
  body{
    margin:0;
    background:#f3ede0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
  }

  /* --- portrait-stage (scaled so whole comp fits ~360x300) --- */
  .portrait-stage{
    position:relative;
    width:230px;            /* scaled down from min(440px,86vw) */
  }

  /* large sage organic blob behind photo */
  .blob{
    position:absolute;
    inset:-6% -8% -8% -6%;
    background:linear-gradient(150deg,#6b7a5e 0%,#55624a 100%);
    border-radius:48% 52% 60% 40% / 55% 45% 55% 45%;
    z-index:0;
  }
  /* small clay blob, bottom-right */
  .blob.b2{
    inset:auto -14% -14% auto;
    width:46%;height:46%;
    background:color-mix(in srgb,#b08364 88%,#fff);
    border-radius:60% 40% 45% 55% / 50% 60% 40% 50%;
    opacity:.92;
  }

  /* the framed photo: blob-shaped crop, 4/5, soft drop shadow */
  .photo-frame{
    position:relative;z-index:1;
    border-radius:48% 52% 60% 40% / 55% 45% 55% 45%;
    overflow:hidden;
    box-shadow:0 26px 60px -28px rgba(51,49,42,.55);
    aspect-ratio:4/5;
  }
  .u-photo{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(.94) contrast(1.02);
  }
</style>
</head>
<body>
  <div class="portrait-stage">
    <span class="blob" aria-hidden="true"></span>
    <span class="blob b2" aria-hidden="true"></span>
    <div class="photo-frame">
      <img class="u-photo" src="portrait.webp" width="440" height="550" alt="portrait">
    </div>
  </div>
</body>
</html>
