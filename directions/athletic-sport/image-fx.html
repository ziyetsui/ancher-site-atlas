<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>athletic-sport — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    margin:0;
    background:#0a0a0a;            /* --canvas */
    min-height:100vh;
    display:grid;place-items:center;
    padding:28px;
  }

  /* representative framed crop of the full-bleed hero photo + scrim + overlay */
  .specimen{
    position:relative;
    width:280px;
    aspect-ratio:3 / 4;
    overflow:hidden;
    border-bottom:2px solid #c6ff00;        /* hero bottom border, --accent */
    display:flex;flex-direction:column;justify-content:flex-end;
  }

  /* --- the photo itself (.hero__media img) --- */
  .specimen img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 30%;
    filter:grayscale(.25) contrast(1.08) brightness(.82);
    z-index:0;
  }

  /* --- the scrim (.hero__media::after), exact gradients --- */
  .specimen::after{
    content:"";position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,0) 28%,rgba(10,10,10,.2) 55%,rgba(10,10,10,.94) 100%),
      linear-gradient(90deg,rgba(10,10,10,.7),rgba(10,10,10,0) 60%);
  }

  /* --- top bar (name / tag) --- */
  .bar{
    position:absolute;top:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 11px;
  }
  .bar .name{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;color:#fff;font-size:11px;letter-spacing:.5px}
  .bar .tag{color:#a3a3a8;font-family:'Archivo',sans-serif;font-size:6px;font-weight:700;letter-spacing:1px;text-transform:uppercase}

  /* --- overlaid headline block (.hero__inner) --- */
  .inner{position:relative;z-index:2;padding:0 13px 16px}
  .eyebrow{
    font-family:'Archivo',sans-serif;font-weight:700;
    font-size:6px;letter-spacing:1.5px;text-transform:uppercase;
    color:#c6ff00;margin-bottom:8px;
  }
  .h1{
    font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-weight:400;
    letter-spacing:-.5px;line-height:.86;color:#fff;
    font-size:30px;
    text-shadow:0 4px 40px rgba(0,0,0,.5);
  }
  .h1 .volt{color:#c6ff00}
</style>
</head>
<body>
  <div class="specimen">
    <img src="portrait.webp" alt="Athlete sprinting at full speed down a city street">
    <div class="bar">
      <span class="name">Dre&nbsp;Coleman</span>
      <span class="tag">Performance&nbsp;Coach</span>
    </div>
    <div class="inner">
      <p class="eyebrow">Dre Coleman / Performance Coach</p>
      <h1 class="h1">I train people to do <span class="volt">hard things</span> on purpose.</h1>
    </div>
  </div>
</body>
</html>
