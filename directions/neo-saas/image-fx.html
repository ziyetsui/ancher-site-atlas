<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neo-saas — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    margin:0;
    background:#ffffff;            /* --canvas */
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
  }

  /* ---- headshot wrapper (scaled down ~0.84 of real 300px → ~252px frame) ---- */
  .headshot{position:relative}

  /* radial glow scrim behind the frame */
  .headshot::before{
    content:"";
    position:absolute;
    inset:-15px;
    background:radial-gradient(120% 120% at 70% 20%,rgba(91,91,214,.16),transparent 60%);
    border-radius:22px;
    z-index:0;
  }

  /* the card-stock photo frame */
  .photo-frame{
    position:relative;
    z-index:1;
    width:252px;
    height:286px;
    border-radius:12px;            /* --rm */
    overflow:hidden;
    border:1px solid #e3e5ea;      /* --hairline */
    box-shadow:0 2px 4px rgba(22,22,26,.05),0 14px 32px -12px rgba(91,91,214,.22); /* --shadow-lift */
    background:#eceef2;            /* --surface-2 */
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* floating proof pill, bottom-left */
  .float-card{
    position:absolute;
    z-index:2;
    bottom:-12px;
    left:-18px;
    background:#ffffff;            /* --canvas */
    border:1px solid #e3e5ea;     /* --hairline */
    border-radius:8px;            /* --rs */
    box-shadow:0 1px 2px rgba(22,22,26,.04),0 4px 16px -8px rgba(22,22,26,.10); /* --shadow-card */
    padding:9px 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .float-card .dot{
    width:7px;height:7px;border-radius:50%;
    background:#1c7a45;flex:none;
  }
  .float-card .fc-num{
    font-weight:700;letter-spacing:-.5px;font-size:14px;color:#16161a;line-height:1.2;
  }
  .float-card .fc-cap{
    font-family:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
    font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:#8a8a98;
  }
</style>
</head>
<body>
  <div class="headshot">
    <div class="photo-frame">
      <img src="portrait.webp" alt="Portrait of Arjun Mehta, founder and product engineer">
    </div>
    <div class="float-card" aria-hidden="true">
      <span class="dot"></span>
      <div>
        <div class="fc-num">2 products</div>
        <div class="fc-cap">live in production</div>
      </div>
    </div>
  </div>
</body>
</html>
