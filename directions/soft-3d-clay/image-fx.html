<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>soft-3d-clay — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    margin:0;min-height:100vh;
    display:grid;place-items:center;padding:28px;
    /* direction page background (resolved literals) */
    background:
      radial-gradient(1200px 700px at 12% -10%, #ffe9f3, transparent 60%),
      radial-gradient(1000px 800px at 100% 0%, #e7f3ff, transparent 55%),
      linear-gradient(165deg, #f4ecff 0%, #efe6ff 55%, #ffeaf4 100%);
    background-attachment:fixed;
    font-family:'Fredoka',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- soft-clay display case (scene-case) ---- */
  .scene-case{
    position:relative;
    width:260px;
    border-radius:40px;            /* --r-lg */
    padding:18px;
    background:linear-gradient(180deg,#fff7ff,#efdcff);
    /* --clay */
    box-shadow:
      0 18px 40px -16px #a98fd6,
      inset 0 2px 3px #ffffff,
      inset 0 -9px 16px -6px #cdb8ea;
  }

  /* ---- the display window (scene-window) ---- */
  .scene-window{
    position:relative;
    border-radius:30px;overflow:hidden;aspect-ratio:1/1;
    background:radial-gradient(120% 90% at 50% 0%, #fff7e6 0%, #ffe0ef 42%, #d9ecff 100%);
    /* --clay-inset */
    box-shadow:
      inset 0 6px 14px -4px #cdb8ea,
      inset 0 -3px 6px #ffffff,
      0 1px 0 #ffffff;
  }
  .scene-window .u-photo{
    display:block;width:100%;height:100%;object-fit:cover;
    border-radius:30px;
  }

  /* ---- floating clay dots ---- */
  .dot{position:absolute;border-radius:50%;z-index:2;
    box-shadow:0 18px 40px -16px #a98fd6, inset 0 2px 3px #ffffff, inset 0 -9px 16px -6px #cdb8ea;}
  .dot.d1{width:54px;height:54px;left:-16px;top:24px;background:linear-gradient(180deg,#ffe49a,#ffd166)}
  .dot.d2{width:38px;height:38px;right:-14px;top:64%;background:linear-gradient(180deg,#a9dbff,#7cc7ff)}
  .dot.d3{width:30px;height:30px;right:34px;top:-14px;background:linear-gradient(180deg,#ffa6cd,#ff7eb3)}

  /* ---- "★ shelf no.1" pill (scene-tag, pill--butter) ---- */
  .scene-tag{
    position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);
    white-space:nowrap;z-index:3;
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;letter-spacing:.2px;
    padding:11px 20px;border-radius:999px;
    background:linear-gradient(180deg,#ffe49a,#ffd166);color:#6a4d0a;
    box-shadow:0 18px 40px -16px #a98fd6, inset 0 2px 3px #ffffff, inset 0 -9px 16px -6px #cdb8ea;
  }
</style>
</head>
<body>
  <div class="scene-case">
    <span class="dot d1" aria-hidden="true"></span>
    <span class="dot d2" aria-hidden="true"></span>
    <span class="dot d3" aria-hidden="true"></span>
    <div class="scene-window">
      <img class="u-photo" src="portrait.webp"
           alt="Portrait in soft pastel display case">
    </div>
    <span class="scene-tag" aria-hidden="true">★ shelf no.1</span>
  </div>
</body>
</html>
