<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cinematic-dark — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    margin:0;
    background:#0a0a0b;            /* --canvas */
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Framed crop of the full-bleed cinematic still ---------------------- */
  .frame{
    position:relative;
    width:280px;
    aspect-ratio:4/5;               /* representative crop of the full-bleed hero */
    background:#000000;             /* --letterbox */
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }

  /* the photo, with the real hero treatment */
  .frame .u-photo{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    filter:grayscale(1) contrast(1.05) brightness(.82);
    display:block;
    z-index:0;
  }

  /* scrim so the title stays legible (real --hero__scrim gradient) */
  .scrim{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,
      rgba(0,0,0,.55) 0%,
      rgba(0,0,0,0) 28%,
      rgba(0,0,0,0) 50%,
      rgba(10,10,11,.55) 78%,
      rgba(10,10,11,.95) 100%);
  }

  /* letterbox bars (scaled from 7vh) */
  .bar{position:absolute;left:0;right:0;height:18px;background:#000000;z-index:3;pointer-events:none}
  .bar--top{top:0}
  .bar--bottom{bottom:0}

  /* overlaid hero text, scaled down */
  .inner{
    position:relative;z-index:2;
    padding:0 16px;
    padding-bottom:34px;            /* clears the bottom bar */
  }
  .eyebrow{
    font-size:7px;font-weight:500;letter-spacing:2px;
    text-transform:uppercase;color:#c4b59a;         /* --accent */
    margin-bottom:9px;
  }
  .thesis{
    font-size:19px;font-weight:200;line-height:1.02;
    letter-spacing:1px;text-transform:uppercase;color:#f4f1ea;  /* --ink */
    max-width:14ch;margin-bottom:11px;
  }
  .meta{
    display:flex;flex-wrap:wrap;gap:3px 7px;align-items:center;
    font-size:8px;font-weight:300;letter-spacing:2px;
    text-transform:uppercase;color:#9a968d;margin-bottom:13px; /* --ink-muted */
  }
  .meta .dot{color:#605d57}                                    /* --ink-subtle */
  .reel{
    display:inline-flex;align-items:center;gap:7px;
    font-size:8px;font-weight:400;letter-spacing:2px;text-transform:uppercase;
    color:#f4f1ea;padding-bottom:4px;border-bottom:1px solid #26262a; /* --hairline */
  }
  .reel .arrow{color:#c4b59a}
</style>
</head>
<body>
  <div class="frame">
    <img class="u-photo" src="portrait.webp" alt="cinematic still">
    <div class="scrim"></div>
    <div class="bar bar--top"></div>
    <div class="bar bar--bottom"></div>
    <div class="inner">
      <p class="eyebrow">Marcus Holt — Director &amp; Cinematographer</p>
      <h1 class="thesis">I make films that feel like a held breath.</h1>
      <div class="meta">
        <span>Narrative</span><span class="dot">/</span>
        <span>Commercial</span><span class="dot">/</span>
        <span>Director &amp; DP</span>
      </div>
      <a class="reel" href="#">View reel <span class="arrow">→</span></a>
    </div>
  </div>
</body>
</html>
