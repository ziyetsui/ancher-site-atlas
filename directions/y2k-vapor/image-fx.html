<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>y2k-vapor — portrait specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    margin:0;
    /* direction page background: --base #06060c, with the radial gradient stack from .bg */
    background:
      radial-gradient(120% 80% at 50% -10%, #14102e 0%, #0c0a18 42%, #06060c 78%),
      #06060c;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
  }

  /* ---------- Portrait stage (scaled down: 4/5, ~260px wide) ---------- */
  .portrait-stage{
    position:relative;
    width:260px;
    aspect-ratio:4/5;
  }

  .portrait-frame{
    position:absolute;inset:0;
    border-radius:28px;            /* --r-lg */
    overflow:hidden;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      0 0 0 1px rgba(0,229,255,.25),
      0 30px 80px -30px #000,
      0 0 60px -12px #ff2bd6,
      inset 0 0 60px -20px rgba(0,229,255,.4);
    background:rgba(18,16,34,0.55);  /* --panel */
    backdrop-filter:blur(4px);
  }

  .portrait-frame img.u-photo{
    width:100%;height:100%;
    object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.15) brightness(.95);
    mix-blend-mode:luminosity;
  }

  /* duotone + scanlines laid over the photo */
  .portrait-frame::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.0) 0 2px, rgba(0,0,0,.18) 2px 3px),
      linear-gradient(150deg, rgba(0,229,255,.30), transparent 45%, rgba(255,43,214,.34));
    mix-blend-mode:screen;
  }

  /* sweeping glitch slice */
  .portrait-frame::before{
    content:"";position:absolute;left:0;right:0;height:14%;top:-14%;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(0,229,255,.35),rgba(255,43,214,.35),transparent);
    mix-blend-mode:screen;
    animation:sweep 5.5s linear infinite;
  }
  @keyframes sweep{0%{top:-14%}100%{top:114%}}

  /* "LIVE · 3AM SET" tag pill */
  .portrait-tag{
    position:absolute;left:-10px;bottom:18px;z-index:3;
    font-family:'Space Mono',ui-monospace,monospace;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#e8ecff;
    padding:7px 12px;border-radius:6px;background:rgba(8,8,16,.78);
    border:1px solid rgba(120,130,200,0.18);
    box-shadow:0 0 18px -6px #00e5ff;
  }
  .portrait-tag b{color:#00e5ff}

  @media (prefers-reduced-motion:reduce){
    .portrait-frame::before{animation:none !important}
  }
</style>
</head>
<body>
  <div class="portrait-stage">
    <div class="portrait-frame">
      <img class="u-photo" src="portrait.webp" alt="Vex Romero — high-contrast black-and-white mosaic portrait" />
    </div>
    <span class="portrait-tag"><b>LIVE</b> · 3AM SET</span>
  </div>
</body>
</html>
