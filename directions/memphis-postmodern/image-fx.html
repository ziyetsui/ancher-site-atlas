<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>memphis-postmodern · photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
    /* direction page background: --canvas with faint dotted paper texture */
    background:#fbf7ee;
    background-image:radial-gradient(rgba(21,19,15,.10) 1px, transparent 1.4px);
    background-size:28px 28px;
    background-position:0 0;
  }

  /* ---- portrait-wrap (scaled: real page width min(420px,86vw) -> 240px here) ---- */
  .portrait-wrap{
    position:relative;
    width:240px;
  }

  /* ---- portrait-frame: the white card-stock frame, tilted, with hard offset shadow ---- */
  .portrait-frame{
    position:relative;
    margin:0;
    background:#ffffff;                 /* --surface */
    border:4px solid #15130f;           /* --outline */
    border-radius:14px;                 /* --r-md */
    box-shadow:10px 10px 0 #15130f;     /* --shadow-lg */
    padding:16px;
    transform:rotate(3deg);
    z-index:3;
  }
  .portrait-frame img{
    display:block;width:100%;height:auto;
    border:3px solid #15130f;           /* --border */
    border-radius:6px;
    background:#2ad4d4;                 /* --cyan (shows behind transparent areas) */
  }

  /* ---- magenta caption pill, counter-tilted, hanging off the bottom edge ---- */
  .portrait-caption{
    position:absolute;left:50%;bottom:-22px;
    transform:translateX(-50%) rotate(-3deg);
    background:#ff4fa3;color:#fff;      /* --magenta */
    font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;
    letter-spacing:1px;text-transform:uppercase;
    padding:8px 16px;
    border:3px solid #15130f;          /* --border */
    border-radius:999px;               /* --r-pill */
    box-shadow:4px 4px 0 #15130f;      /* --shadow-sm */
    z-index:4;white-space:nowrap;
  }
</style>
</head>
<body>
  <figure class="portrait-frame portrait-wrap">
    <img src="portrait.webp" alt="Framed illustration — Bruno Salas portrait piece" />
    <figcaption class="portrait-caption">Yes, a cow in a condo.</figcaption>
  </figure>
</body>
</html>
