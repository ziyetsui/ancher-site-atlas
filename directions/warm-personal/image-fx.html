<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>warm-personal · photo specimen</title>
<style>
  html, body { margin: 0; }
  body {
    background-color: #fbf6ee; /* --canvas */
    background-image:
      radial-gradient(circle at 18% 12%, rgba(194, 104, 63, 0.05), transparent 38%),
      radial-gradient(circle at 86% 78%, rgba(194, 104, 63, 0.045), transparent 40%);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    box-sizing: border-box;
    font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* portrait card frame (from .portrait-card) */
  .portrait-card {
    position: relative;
    width: 230px;
  }

  /* organic dashed ring behind the photo (.portrait-ring) */
  .portrait-ring {
    position: absolute;
    inset: -16px;
    border: 1.5px dashed #f0d9c8; /* --accent-soft */
    border-radius: 46% 54% 52% 48% / 50% 48% 52% 50%;
    z-index: -1;
    opacity: 0.8;
  }

  /* the framed photo (.portrait-photo) */
  .portrait-photo {
    position: relative;
    width: 230px;
    aspect-ratio: 1;
    border-radius: 28px; /* --r-lg */
    object-fit: cover;
    display: block;
    background: #f0d9c8; /* --accent-soft */
    box-shadow:
      0 4px 8px rgba(43, 37, 32, 0.06),
      0 22px 54px rgba(122, 78, 48, 0.13); /* --shadow-lift */
  }

  /* floating badges (.badge-float) */
  .badge-float {
    position: absolute;
    background: #fbf6ee; /* --canvas */
    border: 1px solid #e8dccb; /* --hairline */
    border-radius: 9999px; /* --r-pill */
    padding: 8px 13px;
    box-shadow:
      0 2px 4px rgba(43, 37, 32, 0.04),
      0 14px 34px rgba(122, 78, 48, 0.08); /* --shadow-soft */
    font-size: 11px;
    font-weight: 700;
    color: #2b2520; /* --ink */
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .badge-float .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c2683f; /* --accent */
  }
  .badge-rating {
    top: 10%;
    right: -22px;
  }
  .badge-rating .stars {
    color: #c2683f; /* --accent */
    letter-spacing: 1px;
  }
  .badge-years {
    bottom: 8%;
    left: -26px;
  }
</style>
</head>
<body>
  <div class="portrait-card">
    <span class="portrait-ring" aria-hidden="true"></span>
    <img class="portrait-photo" src="portrait.jpg" width="320" height="320" alt="Priya Nair, executive and leadership coach, smiling warmly" />
    <span class="badge-float badge-rating" aria-hidden="true">
      <span class="stars">★★★★★</span> 4.9 · 80+ reviews
    </span>
    <span class="badge-float badge-years" aria-hidden="true">
      <span class="dot"></span> 9 years · 200+ leaders
    </span>
  </div>
</body>
</html>
