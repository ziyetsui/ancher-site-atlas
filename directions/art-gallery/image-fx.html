<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>art-gallery · photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opt@1,8..72&display=swap" rel="stylesheet">
<style>
  /* art-gallery direction — literal values resolved from index.html
     --canvas:#fbfbf9  --ink:#1a1a18  --ink-subtle:#9b998f  --hairline:#e6e4dd
     --serif:'Newsreader',Georgia,serif  --sans:'Inter',system-ui,sans-serif
     --tight:16px */
  html,body{margin:0}
  body{
    background:#fbfbf9;            /* direction page background (--canvas) */
    color:#1a1a18;
    font-family:'Inter', system-ui, -apple-system, sans-serif;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
  }

  /* the full hero figure: full-bleed editorial photo + museum "plate" caption */
  .hero-figure{
    margin:0;
    width:280px;            /* whole composition fits in ~360x300 */
    max-width:280px;
  }
  .hero-frame{position:relative}

  /* .u-photo.hero-img — full-bleed, object-fit:cover, no border/filter on real page */
  .hero-img{
    display:block;
    width:100%;
    height:300px;          /* representative crop of the min(78vh,760px) hero */
    object-fit:cover;
    object-position:center;
  }

  /* figcaption.plate — the presentation that was getting lost */
  figcaption.plate{
    display:flex;
    gap:18px;
    align-items:baseline;
    flex-wrap:wrap;
    margin-top:16px;       /* --tight */
  }
  figcaption.plate .num{
    font-family:'Inter', system-ui, sans-serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#9b998f;         /* --ink-subtle */
  }
  figcaption.plate .caption{
    font-family:'Newsreader', Georgia, serif;
    font-style:italic;
    font-size:13px;
    line-height:1.4;
    letter-spacing:0.1px;
    color:#9b998f;         /* --ink-subtle */
    margin:0;
  }
</style>
</head>
<body>
  <figure class="hero-figure">
    <div class="hero-frame">
      <img class="u-photo hero-img"
           src="portrait.webp"
           alt="A lone figure standing in a vast, still landscape under soft grey light.">
    </div>
    <figcaption class="plate">
      <span class="num">Plate I</span>
      <span class="caption">Before the Tide — Echizen Coast, 2024</span>
    </figcaption>
  </figure>
</body>
</html>
