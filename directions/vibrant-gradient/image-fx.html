<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vibrant-gradient — photo specimen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    margin:0;
    background:#ffffff;                 /* --canvas, the direction's page bg */
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    color:#16121f;                      /* --ink */
    -webkit-font-smoothing:antialiased;
  }

  /* gradient-bordered photo frame (--rl 36px, 14px matting padding) */
  .photo-frame{
    position:relative;
    width:280px;                        /* whole framed composition fits ~360x300 */
    border-radius:36px;                 /* --rl */
    padding:14px;
    box-shadow:
      0 24px 60px -24px rgba(91,91,255,0.30),
      0 8px 24px -16px rgba(214,51,255,0.22);   /* --shadow */
  }
  /* the gradient border ring */
  .photo-frame::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:38px;                 /* calc(--rl + 2px) */
    background:linear-gradient(120deg,#5b5bff,#d633ff,#ff6b5b);  /* --grad */
    z-index:-1;
    opacity:.9;
  }
  .photo-frame .u-photo{
    display:block;
    width:100%;
    height:300px;                       /* representative crop of clamp(360,46vw,520) */
    object-fit:cover;
    border-radius:32px;                 /* calc(--rl - 4px) */
  }

  /* glass identity badge overlaid at the bottom of the photo */
  .badge{
    position:absolute;
    bottom:26px;
    left:26px;
    right:26px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    border-radius:24px;                 /* --rm */
    background:rgba(255,255,255,0.62);  /* --glass */
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,0.7);  /* --glass-border */
    box-shadow:
      0 24px 60px -24px rgba(91,91,255,0.30),
      0 8px 24px -16px rgba(214,51,255,0.22);
  }
  .badge .avi{
    width:38px;height:38px;
    border-radius:999px;                /* --rp */
    background:linear-gradient(120deg,#5b5bff,#d633ff,#ff6b5b);
    flex:0 0 auto;
    display:grid;place-items:center;
    color:#fff;
    font-family:'Sora',system-ui,sans-serif;
    font-weight:800;font-size:15px;
  }
  .badge .txt b{
    font-family:'Sora',system-ui,sans-serif;
    font-size:15px;display:block;line-height:1.2;
  }
  .badge .txt span{font-size:13px;color:#5a5470;}  /* --ink-muted */
</style>
</head>
<body>
  <figure class="photo-frame">
    <img class="u-photo" src="portrait.webp" alt="Portrait" />
    <figcaption class="badge">
      <span class="avi">NO</span>
      <span class="txt"><b>Nia Okafor</b><span>Ex-Head of Social, DTC</span></span>
    </figcaption>
  </figure>
</body>
</html>
