<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>图像处理 · Image Lab</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root{
      --bg:#fcfcfa; --surface:#f4f4f1; --ink:#16161a; --muted:#5b5b66; --subtle:#8a8a96;
      --line:#e7e7e2; --line-strong:#d4d4cc; --accent:#9a3412; --radius:14px; --maxw:1320px;
      --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
      --checks:#eee;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
    a{color:inherit}
    .masthead{border-bottom:1px solid var(--line);padding:40px 0 0;background:
      radial-gradient(900px 260px at 18% -10%,#f1e7d8 0%,transparent 72%),linear-gradient(180deg,#fffdf8 0%,var(--bg) 100%)}
    .back{display:inline-block;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:18px}
    .back:hover{color:var(--ink)}
    .masthead h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:-1px;margin:0 0 12px;font-weight:700}
    .masthead h1 .en{color:var(--subtle);font-weight:500}
    .lede{max-width:820px;font-size:16px;color:var(--muted);margin:0 0 22px}
    .lede b{color:var(--ink)}
    .stats{display:flex;gap:26px;padding-bottom:26px}
    .stat b{font-size:24px;font-weight:700;letter-spacing:-.5px}
    .stat span{display:block;font-size:12px;color:var(--subtle);text-transform:uppercase;letter-spacing:.5px}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:24px;padding:36px 0 72px}
    @media(max-width:720px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
      transition:box-shadow .18s,transform .18s,border-color .18s}
    .card:hover{box-shadow:0 12px 40px -16px rgba(0,0,0,.2);transform:translateY(-3px);border-color:var(--line-strong)}
    .chead{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
    .chead .nm{font-size:15px;font-weight:700;letter-spacing:-.2px}
    .chead .lin{font-family:var(--mono);font-size:11px;color:#fff;background:#3a3a42;border-radius:999px;padding:2px 8px}
    .chead .go{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none}
    .chead .go:hover{text-decoration:underline}

    .compare{display:grid;grid-template-columns:112px 18px 1fr;align-items:center;gap:8px;padding:14px 16px}
    .compare figure{margin:0;min-width:0}
    .compare figcaption{font-family:var(--mono);font-size:10px;color:var(--subtle);text-align:center;margin-top:6px;letter-spacing:.4px}
    /* original = small contained thumbnail (the untreated source) */
    .rawthumb{height:170px;border-radius:6px;overflow:hidden;padding:6px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);
      background:conic-gradient(var(--checks) 90deg,#f7f7f5 0 180deg,var(--checks) 0 270deg,#f7f7f5 0) 0 0/16px 16px}
    .rawthumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
    /* result = the real framed photo (live mini-page), auto-fit so the WHOLE thing shows */
    .fxbox{position:relative;height:194px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#fff}
    .fxframe{position:absolute;top:0;left:0;width:360px;height:620px;border:0;background:#fff;transform-origin:top left}
    .arrow{font-size:16px;color:var(--subtle);text-align:center}

    .role{margin:0 16px 12px;padding:10px 12px;background:var(--surface);border-left:3px solid var(--accent);
      border-radius:0 8px 8px 0;font-size:13.5px;color:var(--ink)}
    .role .k{font-family:var(--mono);font-size:10px;color:var(--subtle);display:block;margin-bottom:3px;letter-spacing:.5px}
    .tech{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
    .tech span{font-family:var(--mono);font-size:11px;color:var(--ink);background:#f3f2ec;border:1px solid var(--line);
      padding:3px 9px;border-radius:6px}
    .overlay{margin:0 16px 16px;font-size:12px;color:var(--muted)}
    .overlay b{color:var(--accent)}
    .foot{border-top:1px solid var(--line);padding:22px 0;color:var(--subtle);font-size:13px}
    .empty{padding:40px 0;color:var(--muted)}
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="back" href="index.html">← 设计方向图鉴 / Directions</a>
      <h1>图像处理<span class="en"> · Image Lab</span></h1>
      <p class="lede">同一张<b>原图</b>,在每个设计方向里被一段 Prompt 指引、用纯 <b>CSS</b> 处理成完全不同的效果 —— <b>没有改图</b>。这里把每个方向对照展示:<b>原图 → 这个风格怎么用它(Prompt)→ 做了哪些 CSS 改动(颜色/裁切/边框/旋转/叠字)→ 效果</b>。点「看方向页」看它在真实页面里的样子。</p>
      <div class="stats" id="stats"></div>
    </div>
  </header>
  <main class="wrap"><div class="grid" id="grid"></div></main>
  <footer class="foot"><div class="wrap">Ancher · Image Lab —— 原图均为 AI 占位图,无真实身份。</div></footer>
  <script src="js/image-lab.js"></script>
</body>
</html>
